<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>TechNexus | Entrar no painel</title>
    <link rel="icon" type="image/png" href="../img/logo.sem.texto.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="login-pagina d-flex align-items-center justify-content-center px-3 py-5">
        <div class="login-cartao shadow-lg p-4 p-sm-5">
            <div class="text-center mb-4">
                <a href="../index.html"><img src="../img/logo.horizontal.png" alt="TechNexus" class="login-logo mb-4"></a>
                <h1 class="h4 fw-bold mb-1">Área do organizador</h1>
                <p class="text-body-secondary small mb-0">Entre com sua conta para acessar o painel.</p>
            </div>

            <div class="alert alert-danger small py-2 d-none" id="loginErro" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i>E-mail ou senha incorretos.
            </div>

            <form id="formLogin" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label fw-semibold">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="loginEmail" name="email" autocomplete="username" placeholder="voce@technexus.com.br" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="loginSenha" class="form-label fw-semibold">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="loginSenha" name="senha" autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" id="mostrarSenha" aria-label="Mostrar senha"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar">
                    <label class="form-check-label small" for="lembrar">Manter conectado</label>
                </div>
                <button type="submit" class="btn btn-light w-100 fw-semibold py-2">Entrar</button>
            </form>

            <p class="text-center small mt-4 mb-0">
                <a href="../index.html" class="link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"><i class="bi bi-arrow-left me-1"></i>Voltar ao site</a>
            </p>
        </div>
    </main>

    <script>
        // login temporario, depois troca pelo php
        var form = document.getElementById("formLogin");
        var senha = document.getElementById("loginSenha");
        var erro = document.getElementById("loginErro");

        document.getElementById("mostrarSenha").onclick = function () {
            if (senha.type == "password") {
                senha.type = "text";
                this.innerHTML = '<i class="bi bi-eye-slash"></i>';
            } else {
                senha.type = "password";
                this.innerHTML = '<i class="bi bi-eye"></i>';
            }
        };

        form.onsubmit = function (e) {
            e.preventDefault();
            var email = document.getElementById("loginEmail").value;

            if (email == "admin@technexus.com.br" && senha.value == "technexus2026") {
                if (document.getElementById("lembrar").checked) {
                    localStorage.setItem("logado", "sim");
                } else {
                    sessionStorage.setItem("logado", "sim");
                }
                window.location.href = "index.html";
            } else {
                erro.classList.remove("d-none");
                senha.value = "";
            }
        };
    </script>
</body>
</html>
